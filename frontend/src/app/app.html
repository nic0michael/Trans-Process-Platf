<h1>Transaction Processing Platform</h1>

<form (ngSubmit)="submitTransaction()">

  <label>
    Timestamp
    <input
      type="text"
      name="timestamp"
      [(ngModel)]="transaction.timestamp"
      placeholder="2026-09-20 15:30:00"
    />
  </label>

  <label>
    Transaction Index
    <input
      type="text"
      name="transactionIndex"
      [(ngModel)]="transaction.transactionIndex"
    />
  </label>

  <label>
    Request ID
    <input
      type="text"
      name="requestId"
      [(ngModel)]="transaction.requestId"
    />
  </label>

  <label>
    External System ID
    <input
      type="text"
      name="externalSystemId"
      [(ngModel)]="transaction.externalSystemId"
    />
  </label>

  <label>
    Transaction Type
    <select
      name="transactionType"
      [(ngModel)]="transaction.transactionType">

      <option value="PURCHASE">PURCHASE</option>
      <option value="SALE">SALE</option>

    </select>
  </label>

  <label>
    Currency
    <input
      type="text"
      name="currency"
      maxlength="3"
      [(ngModel)]="transaction.currency"
    />
  </label>

  <label>
    Amount
    <input
      type="text"
      name="amount"
      [(ngModel)]="transaction.amount"
    />
  </label>

  <label>
    Reference
    <input
      type="text"
      name="reference"
      [(ngModel)]="transaction.reference"
    />
  </label>

  <label>
    Transaction Description
    <input
      type="text"
      name="transactionDescription"
      [(ngModel)]="transaction.transactionDescription"
    />
  </label>

  <label>
    Company ID
    <input
      type="text"
      name="companyId"
      [(ngModel)]="transaction.companyId"
    />
  </label>

  <label>
    Status
    <input
      type="text"
      name="status"
      [(ngModel)]="transaction.status"
    />
  </label>

  <button type="submit">
    Send Transaction
  </button>

</form>

@if (response) {
<section>
  <h2>Response</h2>

  <p>
    <strong>Response Code:</strong>
    {{ response.responseCode }}
  </p>

  <p>
    <strong>Message:</strong>
    {{ response.responseMessage }}
  </p>

  <p>
    <strong>Transaction GUID:</strong>
    {{ response.transactionGuid }}
  </p>
</section>
}

@if (errorMessage) {
<section>
  <h2>Error</h2>
  <p>{{ errorMessage }}</p>
</section>
}
